spring:
  application:
    name: SafeCall_Service
  config:
    import: optional:file:.env[.properties]

server:
  # Forwarded headers are interpreted only by the endpoint's trusted-proxy resolver.
  forward-headers-strategy: none

app:
  datasource:
    host: ${DB_HOST:127.0.0.1}
    port: ${DB_PORT:3306}
    name: ${DB_NAME:auth_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8081/login/oauth2/code/kakao}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    live-model: ${GEMINI_LIVE_MODEL:models/gemini-3.1-flash-live-preview}
    token-url: ${GEMINI_EPHEMERAL_TOKEN_URL:https://generativelanguage.googleapis.com/v1beta/auth_tokens}
    connection-ttl-seconds: ${SAFECALL_GEMINI_CONNECTION_TTL_SECONDS:1800}
    new-session-ttl-seconds: ${SAFECALL_GEMINI_NEW_SESSION_TTL_SECONDS:60}
  live-token:
    allowed-client-environments: ${SAFECALL_ALLOWED_CLIENT_ENVIRONMENTS:development}
    allowed-origins: ${SAFECALL_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:8082}
    trusted-proxy-cidrs: ${SAFECALL_TRUSTED_PROXY_CIDRS:}
    rate-limit-requests: ${SAFECALL_LIVE_TOKEN_RATE_LIMIT_REQUESTS:10}
    rate-limit-window-seconds: ${SAFECALL_LIVE_TOKEN_RATE_LIMIT_WINDOW_SECONDS:60}
